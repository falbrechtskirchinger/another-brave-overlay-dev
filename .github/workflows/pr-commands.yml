name: PR Commands

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [unlabeled]

env:
  REAP_LOG_LEVEL: ${{ vars.REAP_LOG_LEVEL }}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  handle-command:
    name: Handle PR command
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' ||
      (
        (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
        startsWith(github.event.comment.body, '/')
      )
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout reap
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/reap-private
          ref: main
          ssh-key: ${{ secrets.REAP_DEPLOY_KEY }}
          path: reap-src
          persist-credentials: false
      - name: Link reap actions
        run: reap-src/ci/bootstrap.sh
      - name: Setup reap
        uses: ./.github/actions/setup-reap
        with:
          source: reap-src

      - name: Fetch pipeline
        env:
          REAP_CONFIG_REPO: another-brave-overlay-dev-private
          REAP_CONFIG_DEPLOY_KEY: ${{ secrets.REAP_CONFIG_DEPLOY_KEY }}
        run: reap-src/ci/bootstrap.sh

      - name: Process command event
        id: command
        env:
          GH_TOKEN: ${{ secrets.REAP_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          reap pr handle-event --repo "${{ github.repository }}" --step-summary
      - name: Write held badge
        id: badge
        if: steps.command.outputs.badge_state == 'open_manual'
        run: |
          reap badge write --kind stream --state open_manual --label "${{ steps.command.outputs.stream_id }}" --output badge.json
          echo "filename=${{ steps.command.outputs.stream_id }}.json" >> "$GITHUB_OUTPUT"
      - name: Publish held badge
        if: steps.badge.outputs.filename != ''
        uses: ./.github/actions/publish-badge
        with:
          deploy-key: ${{ secrets.OVERLAY_SYNC_DEPLOY_KEY }}
          repo: git@github.com:${{ github.repository_owner }}/another-brave-overlay-testing.git
          branch: badges
          filename: ${{ steps.badge.outputs.filename }}
          source: badge.json
